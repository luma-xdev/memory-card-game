<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Card Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Match</h1>

        <p class="subtitle">
            Find all matching pairs!
        </p>

        <div class="stats">

            <div class="stat-box">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="stat-box">
                <span>Time</span>
                <strong id="timer">00:00</strong>
            </div>

            <div class="stat-box">
                <span>Pairs</span>
                <strong id="pairs">0 / 8</strong>
            </div>

        </div>

        <div id="game-board" class="game-board"></div>

        <button id="restart-btn" class="restart-btn">
            🔄 Restart Game
        </button>

    </div>


    <!-- Win Modal -->

    <div id="win-modal" class="modal">

        <div class="modal-content">

            <div class="trophy">
                🏆
            </div>

            <h2>You Win!</h2>

            <p>Congratulations! 🎉</p>

            <p>
                You completed the game in
                <strong id="final-moves">0</strong>
                moves.
            </p>

            <p>
                Time:
                <strong id="final-time">00:00</strong>
            </p>

            <button id="play-again" class="restart-btn">
                🎮 Play Again
            </button>

        </div>

    </div>


    <script src="script.js"></script>
    
</body>

</html>
